[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "clinova-crawler"
version = "0.1.0"
description = "Medicine image crawler for the Kenya Drug Index"
requires-python = ">=3.12"
dependencies = [
    "scrapy>=2.11",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "playwright>=1.40",
    "Pillow>=10.2",
    "opencv-python-headless>=4.9",
    "imagehash>=4.3",
    "psycopg2-binary>=2.9",
    "supabase>=2.0",
    "cloudinary>=1.35",
    "rich>=13.7",
    "loguru>=0.7",
    "pydantic>=2.5",
    "httpx>=0.26",
    "aiohttp>=3.9",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"