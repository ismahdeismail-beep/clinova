<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clinova - Offline</title>
  <meta name="theme-color" content="#0E0E10" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#F8FAFC" media="(prefers-color-scheme: light)" />
  <style>
    :root { --bg: #F8FAFC; --surface: #FFFFFF; --text: #0F172A; --text-muted: #64748B; --primary: #2563EB; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0E0E10; --surface: #1A1A1E; --text: #E8E8ED; --text-muted: #A1A1AA; --primary: #00E5FF; }
    }
    * { transition: background-color 0.25s ease, color 0.2s ease; }
    body { margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; background: var(--bg); font-family: system-ui, -apple-system, sans-serif; color: var(--text); }
    .card { text-align: center; padding: 2rem; background: var(--surface); border-radius: 16px; border: 1px solid color-mix(in srgb, var(--text) 10%, transparent); box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
    .logo { width: 48px; height: 48px; margin: 0 auto 1rem; }
    h1 { font-size: 1.25rem; margin-bottom: 0.5rem; font-weight: 700; }
    p { color: var(--text-muted); font-size: 0.875rem; line-height: 1.5; margin: 0; }
    .subtitle { font-size: 0.75rem; margin-top: 1rem; opacity: 0.6; }
  </style>
</head>
<body>
  <div class="card">
    <svg class="logo" viewBox="0 0 32 32" fill="none">
      <path d="M16 1.5L28.5 7.5V17.5Q28.5 26 16 30Q3.5 26 3.5 17.5V7.5Z" fill="var(--primary)" opacity="0.2" stroke="var(--primary)" stroke-width="0.75" stroke-linejoin="round"/>
      <rect x="13.5" y="9" width="5" height="14" rx="2" fill="var(--primary)"/>
      <rect x="9" y="13.5" width="14" height="5" rx="2" fill="var(--primary)"/>
      <circle cx="16" cy="16" r="2.5" fill="var(--primary)"/>
    </svg>
    <h1>You're Offline</h1>
    <p>Clinova will resume when connectivity is restored.</p>
    <p class="subtitle">Cached clinical data is still accessible.</p>
  </div>
</body>
</html>
