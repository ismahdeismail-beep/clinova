name: Medicine Image Crawl

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r packages/crawler/requirements.txt
          playwright install chromium

      - name: Run crawler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STORAGE_PROVIDER: ${{ secrets.STORAGE_PROVIDER }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          MAX_CONCURRENT_DOWNLOADS: '10'
          RETRY_ATTEMPTS: '3'
          RETRY_DELAY_SECONDS: '5'
          IMAGE_MIN_WIDTH: '400'
          IMAGE_MIN_HEIGHT: '400'
          MAX_FILE_SIZE_KB: '200'
          INCREMENTAL_ONLY: 'true'
        run: |
          cd packages/crawler
          python -m src.crawler.orchestrator --all

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: crawl-report
          path: packages/crawler/reports/crawl-report.json
          retention-days: 30